# Done to increase the memory available to gradle.
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.3
loader_version=0.20.1
# 固定到具体 release，别用 1.19-SNAPSHOT：快照会跟着上游变（1.19.3 -> 1.19.4），
# 每次上游发版都要重新下载 Loom，直连 maven 又慢，构建会莫名卡很久。
loom_version=1.19.3

# Mod Properties
version=1.0.0
group=com.civon

# Dependencies
fabric_api_version=0.165.0+26.3
# Trinkets Updated —— 提供独立的 chest/necklace 饰品槽，挂在 maven.nucleoid.xyz
trinkets_version=4.2.1+26.3
# ZXing —— 生成配对二维码，随 jar 一起打包（jar-in-jar）
zxing_version=3.5.3
# Mod Menu —— 只在编译期用到它的 ConfigScreenFactory 接口，不分发
modmenu_version=21.0.0

# Network
# 默认走直连：maven.fabricmc.net 能连上，只是握手慢（实测一次要 30s 左右）。
# 如果启动了本地代理（127.0.0.1:7890），把下面五行取消注释会快很多。
# systemProp.http.proxyHost=127.0.0.1
# systemProp.http.proxyPort=7890
# systemProp.https.proxyHost=127.0.0.1
# systemProp.https.proxyPort=7890
# systemProp.http.nonProxyHosts=localhost|127.0.0.1|*.local

# 直连很慢，超时必须放宽，否则会在 30s 连接超时处失败。
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=180000
systemProp.org.gradle.internal.repository.max.tentatives=3
systemProp.org.gradle.internal.repository.initial.backoff=2000

org.gradle.jvmargs=-Xmx2G
